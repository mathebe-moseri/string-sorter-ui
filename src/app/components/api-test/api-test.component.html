<h2>API Validation Test</h2>

<form (ngSubmit)="onSubmit()">
  <div>
    <label>Email:&emsp;</label>
    <input type="email" [(ngModel)]="email" name="email" required placeholder="Enter your email" />
  </div>

  <br />

  <div>
    <label>Endpoint URL:&emsp;</label>
    <input type="text" [(ngModel)]="endpointUrl" name="endpointUrl" required placeholder="Enter API URL to test" />
  </div>

  <br />

  <button type="submit">Validate</button>
</form>

<hr />
<hr />

<h3>Response:</h3>

<div *ngIf="loading">
  Validating...
</div>
<div *ngIf="error" style="color:red;">
  {{ error }} 
</div>

<pre>
Validation Result:
</pre>
